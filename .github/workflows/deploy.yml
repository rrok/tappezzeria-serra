name: Deploy Angular site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync Google Drive Folder & Inject Config
        env:
          DRIVE_FOLDER_LINK: ${{ vars.DRIVE_FOLDER_LINK || secrets.DRIVE_FOLDER_LINK }}
          GOOGLE_API_KEY: ${{ vars.GOOGLE_API_KEY || secrets.GOOGLE_API_KEY }}
        run: node scripts/sync-drive-gallery.mjs

      - name: Build Angular App for Custom Domain (tappezzeria-serra.it)
        run: npx ng build --configuration production --base-href /

      - name: Ensure CNAME, .nojekyll and 404.html for SPA routing
        run: |
          cp dist/tappezzeria-serra/browser/index.html dist/tappezzeria-serra/browser/404.html
          echo "tappezzeria-serra.it" > dist/tappezzeria-serra/browser/CNAME
          touch dist/tappezzeria-serra/browser/.nojekyll

      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/tappezzeria-serra/browser
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy to GitHub Pages with synced Drive Gallery photos"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
